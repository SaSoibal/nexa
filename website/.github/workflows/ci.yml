name: Website CI/CD

on:
  push:
    branches: [ master, main ]
    paths: [ 'website/**' ]
  pull_request:
    branches: [ master, main ]
    paths: [ 'website/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      working-directory: ./website
      run: npm install

    - name: Run tests
      working-directory: ./website
      run: npm test --if-present

    - name: Build
      working-directory: ./website
      run: npm run build
